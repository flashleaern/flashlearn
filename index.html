<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <!-- 📱 MOBİL SIĞDIRMA VE TAŞMA ENGELLEME ETİKETİ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlashLearn - Ders Seçin</title>
    
    <style>
        /* 🎨 GLOBAL SIFIRLAMA VE TAŞMA ÖNLEME */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden; /* Sağa taşmayı kesin olarak engeller */
            background-color: #0d1117;
            color: #f0f6fc;
            min-height: 100vh;
        }

        /* 🔝 ÜST MENÜ (NAVBAR) */
        header {
            width: 100%;
            background-color: #161b22;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #30363d;
            gap: 10px;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            color: #a855f7; /* Mor-Flash rengi */
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo span {
            color: #f0f6fc;
        }

        .theme-btn {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 1rem;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-courses {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-auth {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
        }

        /* 📦 MAIN CONTAINER */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        .hero {
            margin-bottom: 24px;
        }

        .hero h1 {
            font-size: 1.8rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .hero p {
            color: #8b949e;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        /* 📚 DERS KARTLARI (GRID) */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            width: 100%;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 20px;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: #58a6ff;
        }

        .card-icon {
            font-size: 2.2rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .card-badges {
            display: flex;
            gap: 8px;
        }

        .badge {
            background-color: #21262d;
            color: #8b949e;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid #30363d;
        }

        /* 📱 ÖZEL MOBİL UYUM (768px ve altı telefonlar) */
        @media (max-width: 768px) {
            header {
                padding: 10px 12px;
            }

            .logo {
                font-size: 1.1rem;
            }

            .btn-courses {
                padding: 6px 8px;
                font-size: 0.75rem;
            }

            .btn-auth {
                padding: 6px 10px;
                font-size: 0.75rem;
            }

            .hero h1 {
                font-size: 1.4rem;
            }

            .hero p {
                font-size: 0.85rem;
            }

            .grid {
                grid-template-columns: 1fr; /* Mobilde tek sütun yap */
            }

            .card {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <div class="logo-group">
            <div class="logo">⚡ <span>FlashLearn</span></div>
            <button class="theme-btn" title="Tema Değiştir">☀️</button>
        </div>
        <div class="nav-actions">
            <button class="btn-courses">🏠 Tüm Dersler</button>
            <button class="btn-auth">🔑 Giriş Yap / Kayıt Ol</button>
        </div>
    </header>

    <!-- ANA İÇERİK -->
    <main class="container">
        
        <div class="hero">
            <h1>📚 Ders Seçin</h1>
            <p>Çalışmak istediğiniz dersi seçerek bölümlere ulaşabilirsiniz.</p>
        </div>

        <div class="grid">
            
            <!-- Biyoloji Kartı -->
            <div class="card">
                <div class="card-icon">🧬</div>
                <div class="card-title">Biyoloji</div>
                <div class="card-badges">
                    <span class="badge">📖 1 Not</span>
                    <span class="badge">📝 0 Soru</span>
                </div>
            </div>

            <!-- Matematik Kartı -->
            <div class="card">
                <div class="card-icon">📐</div>
                <div class="card-title">Matematik</div>
                <div class="card-badges">
                    <span class="badge">📖 0 Not</span>
                    <span class="badge">📝 0 Soru</span>
                </div>
            </div>

        </div>

    </main>

</body>
</html>
