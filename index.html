<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <!-- 📱 MOBİL UYUM İÇİN EN KRİTİK SATIR -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashLearn - Mobil Uyumlu Çalışma Platformu</title>
    
    <!-- Supabase JS CDN (Gerekirse açarsın) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* 🎨 TEMEL VE SIFIRLAMA AYARLARI */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 🔝 ÜST MENÜ (NAVBAR) */
        header {
            width: 100%;
            background-color: #1e293b;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .nav-btn:hover {
            background-color: #2563eb;
        }

        /* 📦 ANA İÇERİK KAPSAYICISI */
        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            flex: 1;
            justify-content: center;
        }

        /* 🃏 FLASHCARD (DERS KARTI) ANİMASYONU */
        .card-container {
            width: 100%;
            height: 320px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 20px;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            font-size: 1.4rem;
            text-align: center;
            border-radius: 20px;
            border: 2px solid #334155;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            user-select: none;
        }

        .card-front {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            color: #f8fafc;
        }

        .card-back {
            background: linear-gradient(145deg, #0284c7, #0369a1);
            color: white;
            transform: rotateY(180deg);
        }

        .card-hint {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 15px;
            font-weight: normal;
        }

        .card-back .card-hint {
            color: #e0f2fe;
        }

        /* 🕹️ BUTONLAR VE KONTROLLER */
        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }

        .btn {
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            text-align: center;
        }

        .btn:hover {
            background-color: #334155;
        }

        .btn-primary {
            background-color: #0284c7;
            border: none;
        }

        .btn-primary:hover {
            background-color: #0369a1;
        }

        /* 📱 MOBİL UYUM (RESPONSIVE / TELEFON EKRANLARI) */
        @media (max-width: 768px) {
            header {
                padding: 12px 16px;
            }

            .logo {
                font-size: 1.2rem;
            }

            .container {
                padding: 15px;
                gap: 15px;
            }

            .card-container {
                height: 260px; /* Mobilde kart boyutu otomatik küçülür */
            }

            .card-front, .card-back {
                font-size: 1.2rem;
                padding: 18px;
            }

            .btn {
                padding: 12px;
                font-size: 0.95rem;
                border-radius: 10px;
            }
        }

        @media (max-width: 480px) {
            .card-container {
                height: 230px;
            }

            .card-front, .card-back {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <!-- NAV BAR -->
    <header>
        <div class="logo">⚡ FlashLearn</div>
        <button class="nav-btn" onclick="alert('Giriş sistemi Supabase ile yakında aktif!')">Giriş Yap</button>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="container">
        
        <!-- FLASHCARD -->
        <div class="card-container" onclick="flipCard()">
            <div class="card" id="flashcard">
                <div class="card-front">
                    <p id="card-question">Soru Yükleniyor...</p>
                    <span class="card-hint">🔄 Cevabı görmek için dokun</span>
                </div>
                <div class="card-back">
                    <p id="card-answer">Cevap Yükleniyor...</p>
                    <span class="card-hint">🔄 Soruyu görmek için dokun</span>
                </div>
            </div>
        </div>

        <!-- CONTROLS -->
        <div class="controls">
            <button class="btn" onclick="prevCard()">← Önceki</button>
            <button class="btn btn-primary" onclick="flipCard()">Çevir</button>
            <button class="btn" onclick="nextCard()">Sonraki →</button>
        </div>

    </div>

    <!-- JAVASCRIPT KODLARI -->
    <script>
        // Örnek Kart Verileri
        const cards = [
            { question: "Mitoz bölünme nedir?", answer: "Tek bir hücreden iki özdeş hücre oluşmasıdır." },
            { question: "Fotosentez denklemi nedir?", answer: "6CO2 + 6H2O + Işık ➔ C6H12O6 + 6O2" },
            { question: "Atom numarası neyi gösterir?", answer: "Çekirdekteki proton sayısını gösterir." }
        ];

        let currentIndex = 0;

        function updateCard() {
            const cardElement = document.getElementById('flashcard');
            cardElement.classList.remove('flipped');
            setTimeout(() => {
                document.getElementById('card-question').innerText = cards[currentIndex].question;
                document.getElementById('card-answer').innerText = cards[currentIndex].answer;
            }, 150);
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        function nextCard() {
            if (currentIndex < cards.length - 1) {
                currentIndex++;
            } else {
                currentIndex = 0; // Başa dön
            }
            updateCard();
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
            } else {
                currentIndex = cards.length - 1; // Sona git
            }
            updateCard();
        }

        // Sayfa açıldığında ilk kartı yükle
        updateCard();
    </script>
</body>
</html>
